# Lokal utvecklingsdatabas. Appen körs INTE i Docker — den startas med
# `npm run dev` mot den här databasen. Se README.md.
#
# Porten är 5433 och inte 5432, så den inte krockar med en Postgres du
# redan kör på maskinen.
#
# Här fanns tidigare även en `app`-tjänst med två Dockerfiles. De togs bort
# 2026-08-30: de kunde inte bygga (kopierade en public/-katalog och en
# .next/standalone som aldrig funnits) och hade inte använts på månader.
# Behövs containerisering igen skrivs den mot stacken som gäller då.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seniorshop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
