# Bevakning av beroenden. Portalen hade ingen — 16 paket låg efter senaste
# versionen 2026-08-30, och ingen fick veta när en säkerhetsuppdatering kom.
#
# Veckovis och inte dagligen: en PR-flod varje morgon läses inte, och då är
# bevakningen värdelös. Måndag morgon är lagom — då finns tid att titta.
#
# ⚠️ xlsx TÄCKS INTE. Det hämtas från SheetJS egen CDN-tarball
# (https://cdn.sheetjs.com/...) eftersom de lämnat npm, och varken Dependabot
# eller `npm audit` ser den. Portalens tyngsta filhanteringsbibliotek måste
# alltså bevakas för hand — se punkt 21 på åtgärdslistan.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5

    # ── Prisma: majors tystade, INTE bevakningen ────────────────────────────
    #
    # Prisma 5 → 7 är ett eget projekt, inte en beroendeuppdatering. Det byter
    # klienten, frågemotorn och anslutningspoolen — alltså precis det lager som
    # portalen i dag saknar tester för. Dependabot öppnade PR för det varje
    # vecka, och ett förslag man ändå inte tänker anta är bara brus.
    #
    # BARA major-hopp ignoreras. Patchar och minors inom 5.x släpps igenom, så
    # en säkerhetsfix i t.ex. 5.22.1 syns fortfarande. Det är skillnaden mellan
    # att tysta ett erbjudande och att tysta en varning.
    #
    # ⚠️ LYFT DEN HÄR REGELN NÄR: tester mot databasen finns på plats (punkt 8
    # på åtgärdslistan). Då — och först då — är uppgraderingen verifierbar.
    # Uppgraderingen är alltså inte avskriven, den är SEKVENSERAD: punkt 8
    # först, Prisma 7 direkt efter. Grenen feat/prisma7 från augusti är
    # inaktuell och ska inte återupplivas; gör om arbetet mot dåvarande main.
    # ── ESLint 10 och TypeScript 7: blockerade UPPSTRÖMS ───────────────────
    #
    # Till skillnad från Prisma ovan är det här inte vårt val — verktygskedjan
    # runt Next stödjer dem helt enkelt inte ännu. Båda prövades 2026-08-30
    # (#55, #56) och CI föll på samma ställe: lintningen.
    #
    #   ESLint 10:     eslint-plugin-react, inbakad i eslint-config-next, anropar
    #                  context.getFilename() som ESLint 10 tagit bort.
    #                  "TypeError: contextOrFilename.getFilename is not a function"
    #                  eslint-config-next@16.3.3 är senaste och har problemet.
    #
    #   TypeScript 7:  typescript-eslint vägrar rakt ut — "does not support TS 7.0".
    #                  Senaste (8.68.0) deklarerar typescript ">=4.8.4 <6.1.0",
    #                  alltså inget stöd för 7 alls ännu.
    #                  Spårning: typescript-eslint#10940
    #
    # ⚠️ LYFT NÄR: `npm view eslint-config-next peerDependencies` visar en version
    # med uppdaterad eslint-plugin-react, respektive `npm view typescript-eslint
    # peerDependencies` släpper in typescript >=7. Pröva om, det är billigt.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # ── @types/node: FÅR INTE följa "senaste" ──────────────────────────────
      #
      # Paketets major SKA spegla den Node vi faktiskt kör, inte den nyaste som
      # finns. Vi kör 24 på tre ställen som ska hållas i takt: .nvmrc, engines i
      # package.json och Vercels nodeVersion. Dependabot erbjöd 26 (#60) — det
      # hade beskrivit ett runtime portalen inte använder, alltså exakt den
      # glidning som städades bort 2026-08-30 (punkt 28 på åtgärdslistan).
      #
      # ⚠️ LYFT NÄR: portalen faktiskt byter Node-major. Bumpa då alla fyra
      # samtidigt — .nvmrc, engines, Vercel-inställningen och det här paketet.
      # Minors och patchar inom 24.x släpps igenom som vanligt.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

    groups:
      # Samla småuppdateringar i en PR i stället för fem. Major-versioner
      # hamnar utanför gruppen och får en egen PR var — de förtjänar att läsas
      # en och en (jfr Prisma 5 → 7, som är ett eget projekt).
      smaskaligt:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions-versionerna i ci.yml åldras också, och en action som
  # arkiveras slutar fungera utan förvarning.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
